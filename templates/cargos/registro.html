{% extends "base.html" %}

{% block titulo %}Registrar Cargo{% endblock %}

{% block contenido %}
<div class="card p-4">
    <h2>Registrar Cargo a Estudiante</h2>
    <form method="POST" action="/cargos/registro">
        <div class="form-group">
            <label for="cod_estudiante">Código de Estudiante</label>
            <input list="estudiantes_list" id="cod_estudiante" name="cod_estudiante" required placeholder="Ej: 200001" pattern="^[0-9]{2,8}$" title="Ingrese el código numérico del estudiante (2 a 8 dígitos)">
            <datalist id="estudiantes_list">
                {% for est in estudiantes %}
                <option value="{{ est.codigo }}">{{ est.nombre }} ({{ est.id }})</option>
                {% endfor %}
            </datalist>
        </div>

        <div class="form-group">
            <label for="monto">Monto a cobrar ($)</label>
            <input type="number" id="monto" name="monto" min="1" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="codigo_servicio">Servicio / Concepto</label>
            <select id="codigo_servicio" name="codigo_servicio" required>
                <option value="">-- Seleccione --</option>
                {% for s in servicios %}
                <option value="{{ s.codigo }}">{{ s.descripcion }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="cod_periodo">Periodo Académico</label>
            <select id="cod_periodo" name="cod_periodo" required>
                <option value="">-- Seleccione --</option>
                {% for p in periodos %}
                <option value="{{ p.codigo }}">{{ p.codigo }} - {{ p.descripcion }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Registrar Cargo</button>
    </form>
</div>
{% endblock %}
